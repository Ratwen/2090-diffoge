<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ Математика — Тренажёр задач 16, 17, 18</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a2e;
    --surface3: #22223a;
    --border: #2a2a4a;
    --border-light: #3a3a5a;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --text-dimmer: #555577;
    --accent-blue: #4a7cff;
    --accent-blue-glow: rgba(74, 124, 255, 0.3);
    --accent-green: #34d399;
    --accent-green-glow: rgba(52, 211, 153, 0.3);
    --accent-red: #f87171;
    --accent-red-glow: rgba(248, 113, 113, 0.3);
    --accent-yellow: #fbbf24;
    --accent-yellow-glow: rgba(251, 191, 36, 0.3);
    --accent-purple: #a78bfa;
    --accent-purple-glow: rgba(167, 139, 250, 0.3);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 800px 600px at 20% 20%, rgba(74, 124, 255, 0.06), transparent),
      radial-gradient(ellipse 600px 500px at 80% 80%, rgba(167, 139, 250, 0.05), transparent),
      radial-gradient(ellipse 500px 400px at 50% 50%, rgba(52, 211, 153, 0.03), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
  }

  .header-badge .dot {
    width: 6px; height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, #aaa 50%, var(--accent-blue) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    font-size: 16px;
    color: var(--text-dim);
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 24px 0 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    text-align: center;
    min-width: 120px;
    transition: all 0.3s;
  }

  .stat-card:hover {
    border-color: var(--border-light);
    transform: translateY(-2px);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
  }

  .stat-value.green { color: var(--accent-green); }
  .stat-value.red { color: var(--accent-red); }
  .stat-value.blue { color: var(--accent-blue); }
  .stat-value.yellow { color: var(--accent-yellow); }

  .stat-label {
    font-size: 11px;
    color: var(--text-dimmer);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
    font-weight: 600;
  }

  /* Task Selector */
  .task-selector {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .task-btn {
    position: relative;
    padding: 14px 28px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    overflow: hidden;
  }

  .task-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .task-btn[data-task="16"]::before { background: linear-gradient(135deg, rgba(74,124,255,0.15), rgba(74,124,255,0.05)); }
  .task-btn[data-task="17"]::before { background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(52,211,153,0.05)); }
  .task-btn[data-task="18"]::before { background: linear-gradient(135deg, rgba(167,139,250,0.15), rgba(167,139,250,0.05)); }

  .task-btn:hover {
    border-color: var(--border-light);
    transform: translateY(-2px);
  }

  .task-btn:hover::before { opacity: 1; }

  .task-btn.active {
    transform: translateY(-2px);
  }

  .task-btn[data-task="16"].active {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    box-shadow: 0 4px 20px var(--accent-blue-glow);
  }
  .task-btn[data-task="17"].active {
    border-color: var(--accent-green);
    color: var(--accent-green);
    box-shadow: 0 4px 20px var(--accent-green-glow);
  }
  .task-btn[data-task="18"].active {
    border-color: var(--accent-purple);
    color: var(--accent-purple);
    box-shadow: 0 4px 20px var(--accent-purple-glow);
  }

  .task-btn .task-label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    opacity: 0.6;
    margin-top: 2px;
  }

  /* Progress dots */
  .progress-section {
    margin-bottom: 28px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .progress-count {
    font-size: 13px;
    color: var(--text-dimmer);
    font-family: 'JetBrains Mono', monospace;
  }

  .progress-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .progress-dot {
    width: 44px;
    height: 6px;
    border-radius: 3px;
    background: var(--surface3);
    border: 1px solid var(--border);
    transition: all 0.4s;
    cursor: pointer;
  }

  .progress-dot.correct {
    background: var(--accent-green);
    border-color: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green-glow);
  }

  .progress-dot.wrong {
    background: var(--accent-red);
    border-color: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red-glow);
  }

  .progress-dot.current {
    border-color: var(--accent-blue);
    box-shadow: 0 0 8px var(--accent-blue-glow);
    animation: pulse-current 1.5s infinite;
  }

  @keyframes pulse-current {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* Task Card */
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.4s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .task-card[data-task="16"]::before { background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); }
  .task-card[data-task="17"]::before { background: linear-gradient(90deg, var(--accent-green), var(--accent-blue)); }
  .task-card[data-task="18"]::before { background: linear-gradient(90deg, var(--accent-purple), var(--accent-red)); }

  .task-number {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dimmer);
    margin-bottom: 16px;
  }

  .task-number .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
  }

  .task-card[data-task="16"] .task-number .num {
    background: rgba(74, 124, 255, 0.15);
    color: var(--accent-blue);
  }

  .task-card[data-task="17"] .task-number .num {
    background: rgba(52, 211, 153, 0.15);
    color: var(--accent-green);
  }

  .task-card[data-task="18"] .task-number .num {
    background: rgba(167, 139, 250, 0.15);
    color: var(--accent-purple);
  }

  .task-text {
    font-size: 18px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 28px;
    font-weight: 400;
  }

  .task-text strong {
    color: #fff;
    font-weight: 600;
  }

  .task-text .math {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface3);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 16px;
    color: var(--accent-yellow);
  }

  /* Diagram placeholder */
  .diagram {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 24px;
    margin-bottom: 24px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.8;
  }

  .diagram svg {
    max-width: 100%;
    height: auto;
  }

  /* Answer Section */
  .answer-section {
    display: flex;
    gap: 12px;
    align-items: stretch;
    margin-bottom: 20px;
  }

  .answer-input {
    flex: 1;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--text);
    outline: none;
    transition: all 0.3s;
  }

  .answer-input::placeholder {
    color: var(--text-dimmer);
    font-size: 14px;
  }

  .answer-input:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 4px var(--accent-blue-glow);
  }

  .answer-input.correct {
    border-color: var(--accent-green);
    box-shadow: 0 0 0 4px var(--accent-green-glow);
  }

  .answer-input.wrong {
    border-color: var(--accent-red);
    box-shadow: 0 0 0 4px var(--accent-red-glow);
  }

  .submit-btn {
    padding: 16px 32px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent-blue), #6366f1);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px var(--accent-blue-glow);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  /* Buttons row */
  .buttons-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    border-color: var(--border-light);
    color: var(--text);
    transform: translateY(-1px);
  }

  .btn-hint {
    border-color: rgba(251, 191, 36, 0.3);
    color: var(--accent-yellow);
  }

  .btn-hint:hover {
    background: rgba(251, 191, 36, 0.1);
    border-color: var(--accent-yellow);
  }

  .btn-skip {
    border-color: rgba(248, 113, 113, 0.3);
    color: var(--accent-red);
  }

  .btn-skip:hover {
    background: rgba(248, 113, 113, 0.1);
    border-color: var(--accent-red);
  }

  .btn-next {
    background: linear-gradient(135deg, var(--accent-green), #059669);
    border: none;
    color: #fff;
    padding: 12px 24px;
  }

  .btn-next:hover {
    box-shadow: 0 4px 20px var(--accent-green-glow);
  }

  /* Hints */
  .hints-container {
    margin-top: 16px;
    animation: fadeInUp 0.3s ease;
  }

  .hint-step {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-yellow);
    border-radius: var(--radius-xs);
    padding: 14px 18px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
    animation: fadeInUp 0.3s ease;
  }

  .hint-step .hint-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-yellow);
    margin-bottom: 6px;
  }

  .hint-step .math {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface3);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 13px;
    color: var(--accent-yellow);
  }

  /* Result */
  .result-box {
    margin-top: 20px;
    padding: 20px 24px;
    border-radius: var(--radius-sm);
    animation: fadeInUp 0.4s ease;
  }

  .result-box.correct {
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.3);
  }

  .result-box.wrong {
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.3);
  }

  .result-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .result-box.correct .result-title { color: var(--accent-green); }
  .result-box.wrong .result-title { color: var(--accent-red); }

  .result-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
  }

  .result-text .math {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface3);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 13px;
    color: var(--accent-yellow);
  }

  .solution-steps {
    margin-top: 16px;
  }

  .solution-step {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    animation: fadeInUp 0.3s ease;
  }

  .solution-step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    flex-shrink: 0;
    margin-top: 2px;
  }

  .solution-step-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
  }

  .solution-step-text .math {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface3);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 13px;
    color: var(--accent-yellow);
  }

  /* Completion screen */
  .completion {
    text-align: center;
    padding: 60px 20px;
    animation: fadeInUp 0.5s ease;
  }

  .completion-icon {
    font-size: 64px;
    margin-bottom: 20px;
  }

  .completion h2 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .completion p {
    color: var(--text-dim);
    font-size: 16px;
    margin-bottom: 30px;
  }

  .restart-btn {
    padding: 14px 36px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent-blue), #6366f1);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }

  .restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px var(--accent-blue-glow);
  }

  /* Hidden */
  .hidden { display: none !important; }

  /* Responsive */
  @media (max-width: 600px) {
    .app { padding: 12px; }
    .task-card { padding: 20px; }
    .answer-section { flex-direction: column; }
    .submit-btn { width: 100%; justify-content: center; }
    .stats-bar { gap: 8px; }
    .stat-card { min-width: 80px; padding: 10px 14px; }
    .stat-value { font-size: 20px; }
    .task-text { font-size: 16px; }
    .header { padding: 24px 10px 20px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* Confetti canvas */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-badge">
      <span class="dot"></span>
      ОГЭ Математика 2026
    </div>
    <h1>Тренажёр задач</h1>
    <p>Задания 16, 17, 18 — геометрия. 5 прототипов для каждого номера. Решай, получай подсказки, разбирай ошибки.</p>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-value green" id="stat-correct">0</div>
      <div class="stat-label">Верно</div>
    </div>
    <div class="stat-card">
      <div class="stat-value red" id="stat-wrong">0</div>
      <div class="stat-label">Ошибки</div>
    </div>
    <div class="stat-card">
      <div class="stat-value blue" id="stat-hints">0</div>
      <div class="stat-label">Подсказки</div>
    </div>
    <div class="stat-card">
      <div class="stat-value yellow" id="stat-accuracy">—</div>
      <div class="stat-label">Точность</div>
    </div>
  </div>

  <!-- Task Selector -->
  <div class="task-selector">
    <button class="task-btn active" data-task="16" onclick="selectTask(16)">
      №16
      <span class="task-label">Углы и треугольники</span>
    </button>
    <button class="task-btn" data-task="17" onclick="selectTask(17)">
      №17
      <span class="task-label">Площади фигур</span>
    </button>
    <button class="task-btn" data-task="18" onclick="selectTask(18)">
      №18
      <span class="task-label">Пифагор и подобие</span>
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-title">Прогресс</span>
      <span class="progress-count" id="progress-count">1 / 5</span>
    </div>
    <div class="progress-dots" id="progress-dots"></div>
  </div>

  <!-- Task Area -->
  <div id="task-area">
    <div class="task-card" id="task-card" data-task="16">
      <div class="task-number">
        <span class="num" id="task-num-label">16</span>
        <span id="task-prototype-label">Прототип 1 из 5</span>
      </div>
      <div class="task-text" id="task-text"></div>
      <div class="diagram" id="task-diagram"></div>
      <div class="answer-section">
        <input type="text" class="answer-input" id="answer-input" placeholder="Введите ответ..." autocomplete="off">
        <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">Ответить</button>
      </div>
      <div class="buttons-row">
        <button class="btn btn-hint" id="hint-btn" onclick="showHint()">💡 Подсказка</button>
        <button class="btn btn-skip" onclick="skipTask()">⏭ Пропустить</button>
      </div>
      <div class="hints-container" id="hints-container"></div>
      <div id="result-container"></div>
    </div>
  </div>
</div>

<script>
// ==================== TASK DATABASE ====================
const tasks = {
  16: [
    {
      id: '16-1',

// ==================== STATE ====================
let currentTask = 16;
let currentTaskIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let hintCount = 0;
let currentHintIndex = 0;
let answered = [];
let isAnswered = false;
let taskResults = [];

// ==================== FUNCTIONS ====================
function selectTask(num) {
  currentTask = num;
  currentTaskIndex = 0;
  currentHintIndex = 0;
  isAnswered = false;
  taskResults = [];
  answered = [];

  document.querySelectorAll('.task-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.task) === num);
  });

  renderProgress();
  renderTask();
}

function renderProgress() {
  const total = tasks[currentTask].length;
  document.getElementById('progress-count').textContent = `${currentTaskIndex + 1} / ${total}`;

  const dotsContainer = document.getElementById('progress-dots');
  dotsContainer.innerHTML = '';

  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i === currentTaskIndex) dot.classList.add('current');
    if (taskResults[i] === 'correct') dot.classList.add('correct');
    if (taskResults[i] === 'wrong') dot.classList.add('wrong');
    dot.onclick = () => {
      if (taskResults[i] !== undefined) {
        currentTaskIndex = i;
        currentHintIndex = 0;
        isAnswered = false;
        renderProgress();
        renderTask();
      }
    };
    dotsContainer.appendChild(dot);
  }
}

function renderTask() {
  const task = tasks[currentTask][currentTaskIndex];
  const card = document.getElementById('task-card');
  card.setAttribute('data-task', currentTask);

  document.getElementById('task-num-label').textContent = currentTask;
  document.getElementById('task-prototype-label').textContent = `Прототип ${currentTaskIndex + 1} из 5`;
  document.getElementById('task-text').innerHTML = task.text;
  document.getElementById('task-diagram').innerHTML = task.diagram;

  const input = document.getElementById('answer-input');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  input.focus();

  document.getElementById('submit-btn').textContent = 'Ответить';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').onclick = checkAnswer;

  document.getElementById('hints-container').innerHTML = '';
  document.getElementById('result-container').innerHTML = '';
  document.getElementById('hint-btn').style.display = '';

  currentHintIndex = 0;
  isAnswered = false;
  renderProgress();
}

function parseAnswer(str) {
  return parseFloat(str.replace(',', '.').replace(/\s/g, ''));
}

function checkAnswer() {
  if (isAnswered) {
    nextTask();
    return;
  }

  const input = document.getElementById('answer-input');
  const raw = input.value.trim();
  if (!raw) {
    input.style.borderColor = 'var(--accent-red)';
    setTimeout(() => input.style.borderColor = '', 1000);
    return;
  }

  const userAnswer = parseAnswer(raw);
  const task = tasks[currentTask][currentTaskIndex];
  const correct = Math.abs(userAnswer - task.answer) < 0.01;

  isAnswered = true;

  if (correct) {
    correctCount++;
    taskResults[currentTaskIndex] = 'correct';
    input.className = 'answer-input correct';
    input.disabled = true;

    document.getElementById('result-container').innerHTML = `
      <div class="result-box correct">
        <div class="result-title">✅ Верно!</div>
        <div class="result-text">Отличная работа! Ответ: <span class="math">${task.answer}</span></div>
      </div>
    `;

    document.getElementById('submit-btn').textContent = 'Далее →';
    document.getElementById('submit-btn').onclick = nextTask;
    document.getElementById('hint-btn').style.display = 'none';

    // Mini confetti
    createMiniConfetti();
  } else {
    wrongCount++;
    taskResults[currentTaskIndex] = 'wrong';
    input.className = 'answer-input wrong';
    input.disabled = true;

    let solutionHTML = task.solution.map((step, i) => `
      <div class="solution-step" style="animation-delay: ${i * 0.1}s">
        <div class="solution-step-num">${i + 1}</div>
        <div class="solution-step-text">${step}</div>
      </div>
    `).join('');

    document.getElementById('result-container').innerHTML = `
      <div class="result-box wrong">
        <div class="result-title">❌ Неверно</div>
        <div class="result-text">Ваш ответ: <span class="math">${raw}</span>. Правильный ответ: <span class="math">${task.answer}</span></div>
        <div class="solution-steps">${solutionHTML}</div>
      </div>
    `;

    document.getElementById('submit-btn').textContent = 'Далее →';
    document.getElementById('submit-btn').onclick = nextTask;
    document.getElementById('hint-btn').style.display = 'none';
  }

  updateStats();
  renderProgress();
}

function showHint() {
  const task = tasks[currentTask][currentTaskIndex];
  if (currentHintIndex >= task.hints.length) return;

  hintCount++;
  const hint = task.hints[currentHintIndex];

  const container = document.getElementById('hints-container');
  const hintEl = document.createElement('div');
  hintEl.className = 'hint-step';
  hintEl.innerHTML = `
    <div class="hint-label">${hint.label}</div>
    <div>${hint.text}</div>
  `;
  container.appendChild(hintEl);

  currentHintIndex++;
  updateStats();

  if (currentHintIndex >= task.hints.length) {
    document.getElementById('hint-btn').textContent = '💡 Подсказки кончились';
    document.getElementById('hint-btn').disabled = true;
    document.getElementById('hint-btn').style.opacity = '0.5';
  }
}

function skipTask() {
  if (!isAnswered) {
    wrongCount++;
    taskResults[currentTaskIndex] = 'wrong';
    updateStats();
  }
  nextTask();
}

function nextTask() {
  currentTaskIndex++;
  if (currentTaskIndex >= tasks[currentTask].length) {
    showCompletion();
    return;
  }
  currentHintIndex = 0;
  isAnswered = false;

  const hintBtn = document.getElementById('hint-btn');
  hintBtn.textContent = '💡 Подсказка';
  hintBtn.disabled = false;
  hintBtn.style.opacity = '1';

  renderProgress();
  renderTask();
}

function showCompletion() {
  const total = tasks[currentTask].length;
  const correct = taskResults.filter(r => r === 'correct').length;
  const wrong = taskResults.filter(r => r === 'wrong').length;
  const accuracy = total > 0 ? Math.round(correct / total * 100) : 0;

  document.getElementById('task-area').innerHTML = `
    <div class="task-card" data-task="${currentTask}">
      <div class="completion">
        <div class="completion-icon">${accuracy >= 80 ? '🏆' : accuracy >= 50 ? '📚' : '💪'}</div>
        <h2>${accuracy >= 80 ? 'Отличный результат!' : accuracy >= 50 ? 'Неплохо!' : 'Нужно подтянуть!'}</h2>
        <p>Задание №${currentTask} — ${correct} верных из ${total} (${accuracy}%)</p>
        <div class="stats-bar" style="margin-bottom: 24px;">
          <div class="stat-card">
            <div class="stat-value green">${correct}</div>
            <div class="stat-label">Верно</div>
          </div>
          <div class="stat-card">
            <div class="stat-value red">${wrong}</div>
            <div class="stat-label">Ошибки</div>
          </div>
        </div>
        <button class="restart-btn" onclick="selectTask(${currentTask})">🔄 Пройти заново</button>
        <br><br>
        <button class="restart-btn" style="background: linear-gradient(135deg, var(--accent-green), #059669); margin-left: 10px;" onclick="nextSection()">
          ${currentTask < 18 ? 'Перейти к следующему →' : 'Начать сначала'}
        </button>
      </div>
    </div>
  `;

  if (accuracy >= 80) {
    launchConfetti();
  }
}

function nextSection() {
  if (currentTask === 16) selectTask(17);
  else if (currentTask === 17) selectTask(18);
  else selectTask(16);
}

function updateStats() {
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-hints').textContent = hintCount;

  const total = correctCount + wrongCount;
  const accuracy = total > 0 ? Math.round(correctCount / total * 100) + '%' : '—';
  document.getElementById('stat-accuracy').textContent = accuracy;
}

// ==================== CONFETTI ====================
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const colors = ['#4a7cff', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#fff'];

  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;

    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      if (frame > 120) p.opacity -= 0.01;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });

    if (frame < 250 && pieces.some(p => p.opacity > 0)) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  animate();
}

function createMiniConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const colors = ['#34d399', '#4a7cff', '#fbbf24'];

  for (let i = 0; i < 40; i++) {
    pieces.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 200,
      y: canvas.height / 2,
      w: Math.random() * 8 + 4,
      h: Math.random() * 5 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 8 - 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 15,
      opacity: 1,
      gravity: 0.15
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;

    pieces.forEach(p => {
      p.x += p.vx;
      p.vy += p.gravity;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      if (frame > 40) p.opacity -= 0.015;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });

    if (frame < 100 && pieces.some(p => p.opacity > 0)) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  animate();
}

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const btn = document.getElementById('submit-btn');
    if (!btn.disabled) btn.click();
  }
});

// Fix task 16-3 answer
tasks[16][2].answer = 36;

// Init
selectTask(16);
